<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<style>
			/* Boot screen: painted before any JS, faded out by the root layout once hydrated. */
			#boot {
				position: fixed;
				inset: 0;
				z-index: 2147483646;
				display: grid;
				place-content: center;
				justify-items: center;
				gap: 22px;
				background: var(--background, #fafafa);
				color: var(--foreground, #151515);
				transition:
					opacity 320ms cubic-bezier(0.16, 1, 0.3, 1),
					visibility 0s linear 320ms;
			}
			html.dark #boot {
				background: var(--background, #0f0f0f);
				color: var(--foreground, #f5f5f5);
			}
			html[data-ready] #boot {
				opacity: 0;
				visibility: hidden;
			}
			#boot svg {
				width: 40px;
				height: 40px;
				animation: boot-breathe 1.6s ease-in-out infinite;
			}
			#boot .bar {
				position: relative;
				width: 112px;
				height: 2px;
				overflow: hidden;
				border-radius: 999px;
				background: color-mix(in oklch, currentColor 12%, transparent);
			}
			#boot .bar::after {
				content: "";
				position: absolute;
				inset: 0 auto 0 0;
				width: 40%;
				border-radius: inherit;
				background: currentColor;
				animation: boot-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
			}
			@keyframes boot-breathe {
				50% {
					opacity: 0.55;
					transform: scale(0.94);
				}
			}
			@keyframes boot-slide {
				from {
					transform: translateX(-100%);
				}
				to {
					transform: translateX(250%);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#boot svg,
				#boot .bar::after {
					animation: none;
				}
			}
		</style>
		<noscript><style>#boot { display: none; }</style></noscript>		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot" aria-hidden="true">
			<svg viewBox="0 0 24 24" aria-hidden="true">
				<path
					fill="currentColor"
					d="M3 3.5A2.5 2.5 0 0 1 8 3.5V16H3ZM8.5 9H15.5A5.5 5.5 0 0 1 21 14.5V17.5A5.5 5.5 0 0 1 15.5 23H8.5A5.5 5.5 0 0 1 3 17.5V14.5A5.5 5.5 0 0 1 8.5 9ZM10.2 14.4A1.6 1.6 0 1 0 10.2 17.6A1.6 1.6 0 1 0 10.2 14.4ZM14.2 14.4A1.6 1.6 0 1 0 14.2 17.6A1.6 1.6 0 1 0 14.2 14.4Z"
				/>
			</svg>
			<span class="bar"></span>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
