packages:
  - "apps/*"
  - "apps/playground/*"
  - "packages/*"

# pnpm writes these as a placeholder and then refuses the install until they are
# booleans. esbuild links its platform binary here; workerd is what wrangler runs.
allowBuilds:
  esbuild: true
  workerd: true

# One version of everything, declared once. Packages reference these as
# `catalog:` so a component copied out of here can't pick up a stale peer.
catalog:
  sonner: ^2.0.8
  svelte-sonner: ^1.2.1
  vaul: ^1.1.2
  bits-ui: ^2.19.2
  cmdk: ^1.1.1
  vaul-svelte: ^1.0.0-next.7
  # TypeScript 7 is `latest`, but svelte-check@4 peers on ^5 || ^6 and strict
  # peers are on, so 6 is the newest that installs. Revisit when it widens.
  typescript: ^6.0.3
  "@types/node": ^26.6.2
  zod: ^4.6.5
  vite: ^8.3.0

  svelte: ^5.57.1
  "@sveltejs/kit": ^2.70.3
  "@sveltejs/vite-plugin-svelte": ^7.3.0
  "@sveltejs/adapter-cloudflare": ^7.2.9
  svelte-check: ^4.7.6

  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1

  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  tailwind-variants: ^3.3.1

  "@base-ui/react": ^1.8.0
  d3-array: ^3.2.4
  d3-geo: ^3.1.1
  d3-scale: ^4.0.2
  d3-shape: ^3.2.0
  d3-sankey: ^0.12.3
  "@types/d3-array": ^3.2.2
  "@types/d3-geo": ^3.1.1
  "@types/geojson": ^7946.0.16
  world-atlas: ^2.0.2
  topojson-client: ^3.1.0
  "@types/topojson-client": ^3.1.5
  "@types/d3-scale": ^4.0.9
  "@types/d3-shape": ^3.2.0
  "@types/d3-sankey": ^0.12.5
  shiki: ^4.4.3
  "@shikijs/langs": ^4.4.3
  "@shikijs/themes": ^4.4.3
  "@fontsource-variable/inter": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0

onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@tailwindcss/oxide"
  - esbuild
  - workerd
