name: Setup
description: Toolchain (pnpm, Node, Bun), dependencies, and optionally the build caches.

inputs:
  build-caches:
    description: Restore and save the turbo and registry transpile caches.
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: pnpm

    # registry-schema bundles with `bun build` and registry-build runs its CLI with
    # `bun run`, so bun is part of the toolchain, not just a local convenience.
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - run: pnpm install --frozen-lockfile
      shell: bash

    # Keyed on what the builds read, so identical inputs always hit and a changed tree starts from
    # the newest cache. A per-commit key saved once per commit and rarely matched across jobs.
    - if: inputs.build-caches == 'true'
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'components/**', 'packages/*/src/**', 'apps/*/src/**', 'scripts/**', 'pro/components/**', 'pro/packages/*/src/**') }}
        restore-keys: turbo-${{ runner.os }}-

    - if: inputs.build-caches == 'true'
      uses: actions/cache@v4
      with:
        path: packages/registry-build/node_modules/.cache/registry-build
        key: registry-tojs-${{ hashFiles('pnpm-lock.yaml', 'packages/registry-build/src/tojs.ts') }}-${{ github.run_id }}
        restore-keys: registry-tojs-${{ hashFiles('pnpm-lock.yaml', 'packages/registry-build/src/tojs.ts') }}-
