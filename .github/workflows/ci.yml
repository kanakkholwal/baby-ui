name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  # Deploy runs this first, so main gets the same gates without a second copy of them.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    name: Lint, gates, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # The pre-commit hook fixes these locally; CI only verifies, never writes.
      - name: Lint and format
        run: pnpm exec biome ci .

      - name: Comment gate
        run: node scripts/check-comments.mjs --all

      - name: Import extensions
        run: node scripts/check-import-extensions.mjs

      - name: Tests (scripts, chart core, registry-build)
        run: pnpm test

  build:
    name: Type-check, build, bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          build-caches: "true"

      - name: Type-check
        run: pnpm exec turbo run check

      - name: Build
        run: pnpm build

      - name: Worker bundle budget
        run: pnpm size

      # Built by `pnpm build`; kept so the React preview can be deployed once it has a host.
      - name: Upload React runner build
        uses: actions/upload-artifact@v4
        with:
          name: react-runner
          path: apps/playground/react-runner/dist
          if-no-files-found: error
          retention-days: 14
