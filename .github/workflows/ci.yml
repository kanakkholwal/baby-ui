name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # registry-schema bundles with `bun build` and registry-build runs its CLI with
      # `bun run`, so bun is part of the toolchain, not just a local convenience.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Comment and import gates, type-check
        run: pnpm check

      - name: Chart core tests
        run: pnpm test:chart

      - name: Build
        run: pnpm build

      - name: Worker bundle budget
        run: pnpm size

      # Built by `pnpm build`; kept so the React preview can be deployed once it has a host.
      - name: Upload React runner build
        uses: actions/upload-artifact@v4
        with:
          name: react-runner
          path: apps/playground/react-runner/dist
          if-no-files-found: error
          retention-days: 14
