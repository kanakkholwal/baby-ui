name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two Cloudflare projects, one build: the site Worker and the registry Pages project
# must never serve JSON from different commits.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BABY_UI_SITE_URL: https://baby-ui.nexonauts.com
  BABY_UI_REGISTRY_URL: https://baby-ui.pages.dev
  WRANGLER_VERSION: "4.135.0"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      # CI builds with production settings once and uploads the result; deploy ships that.
      artifact: true
    # The build job needs the private repo token.
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Only wrangler is needed here, so skip the build caches and the Pro checkout.
      - uses: ./.github/actions/setup

      - name: Download the CI build
        uses: actions/download-artifact@v4
        with:
          name: deploy-output
          path: ${{ runner.temp }}/deploy-output

      # upload-artifact keeps paths relative to the common ancestor (apps/).
      - name: Put the build in place
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/deploy-output"
          find "$out" -maxdepth 3 -type d | head -20
          mkdir -p apps/registry apps/site/.svelte-kit
          cp -R "$out/registry/dist" apps/registry/dist
          cp -R "$out/site/.svelte-kit/cloudflare" apps/site/.svelte-kit/cloudflare
          cp -R "$out/site/.svelte-kit/cloudflare-tmp" apps/site/.svelte-kit/cloudflare-tmp
          test -d apps/registry/dist
          test -f apps/site/.svelte-kit/cloudflare/_worker.js
          test -f apps/site/.svelte-kit/cloudflare-tmp/server.js

      - name: Deploy registry to Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: apps/registry
          command: pages deploy --branch=main

      - name: Deploy site Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: apps/site
          command: deploy

      - name: Smoke-test both origins
        run: |
          set -euo pipefail
          for url in \
            "$BABY_UI_REGISTRY_URL/r/registry.json" \
            "$BABY_UI_REGISTRY_URL/svelte/r/button.json" \
            "$BABY_UI_SITE_URL/" \
            "$BABY_UI_SITE_URL/components/base/button"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$url")
            echo "$code  $url"
            [ "$code" = "200" ]
          done

      # The flag-off site serves no Pro page and links to none.
      - name: Pro pages stay dark
        run: |
          set -euo pipefail
          for path in /pricing /checkout /dashboard /login /account /account/downloads; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$BABY_UI_SITE_URL$path")
            echo "$code  $path"
            [ "$code" = "404" ]
          done
          if curl -sS "$BABY_UI_SITE_URL/" | grep -q 'href="/pricing"'; then
            echo "The home page links to /pricing"; exit 1
          fi
