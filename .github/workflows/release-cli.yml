name: Release CLI

# Automatic: a push to main that touches the CLI publishes it. If its version is already on npm
# the workflow bumps both packages (patch by default), commits that to main, publishes and tags
# each as <name>@<version> through a GitHub release. A hand-bumped version publishes as it is.
# Manual: pick a bump and dist-tag, or dry-run to see exactly what would ship.
on:
  push:
    branches: [main]
    paths:
      - packages/cli/**
      - packages/create-baby-ui/**
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump when the current version is already on npm
        type: choice
        options: [patch, minor, major, none]
        default: patch
      dry-run:
        description: Build, pack and run `npm publish --dry-run` only
        type: boolean
        default: true
      dist-tag:
        description: npm dist-tag (latest, next, beta)
        type: string
        default: latest

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/cli.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo settings to gate every release.
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
      DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist-tag || 'latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The version commit is pushed back to the branch.
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or newer.
      - name: npm with trusted publishing
        run: npm install --global npm@^11.5.1

      - run: pnpm install --frozen-lockfile --filter @baby-ui/cli... --filter create-baby-ui...

      # Both packages move together; create-baby-ui pins the CLI, so one lockstep version is simplest.
      - name: Version
        env:
          BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          cli=$(node -p "require('./packages/cli/package.json').version")
          if [ "$BUMP" = "none" ] || ! npm view "@baby-ui/cli@$cli" version >/dev/null 2>&1; then
            echo "::notice::Publishing @baby-ui/cli@$cli as it is."
            exit 0
          fi
          for dir in packages/cli packages/create-baby-ui; do
            (cd "$dir" && npm version "$BUMP" --no-git-tag-version --allow-same-version >/dev/null)
          done
          next=$(node -p "require('./packages/cli/package.json').version")
          echo "::notice::Bumped $cli to $next."
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/cli/package.json packages/create-baby-ui/package.json
            git commit -m "chore(release): cli $next [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build
        run: pnpm --filter @baby-ui/cli build

      # The CLI first: create-baby-ui pins its exact version, which must already exist.
      # `pnpm pack` turns `workspace:*` into that version; npm then publishes the tarball.
      - name: Publish
        env:
          # Only for the very first publish, before trusted publishing can be configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/published"
          for dir in packages/cli packages/create-baby-ui; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already on npm, skipped."
              continue
            fi
            out="$RUNNER_TEMP/packs/$(basename "$dir")"
            (cd "$dir" && pnpm pack --pack-destination "$out")
            tarball=$(ls "$out"/*.tgz)
            flags=(--access public --tag "$DIST_TAG" --provenance)
            if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
            npm publish "$tarball" "${flags[@]}"
            if [ "$DRY_RUN" != "true" ]; then echo "$name@$version" >> "$RUNNER_TEMP/published"; fi
          done

      - name: GitHub releases
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pre=()
          if [ "$DIST_TAG" != "latest" ]; then pre=(--prerelease); fi
          while read -r release; do
            [ -n "$release" ] || continue
            gh release create "$release" --target "$GITHUB_SHA" --title "$release" "${pre[@]}" \
              --notes "Published to npm with provenance: https://www.npmjs.com/package/${release%@*}"
          done < "$RUNNER_TEMP/published"
